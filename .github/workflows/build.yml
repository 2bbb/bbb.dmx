name: Build & Package

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DBBB_DMX_BUILD_EXTERNALS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify universal binaries
        run: |
          while IFS= read -r binary; do
            lipo -info "$binary"
            lipo "$binary" -verify_arch x86_64 arm64
          done < <(find externals -path '*/Contents/MacOS/*' -type f | sort)

      - name: Sign Max externals
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/macos-direct-distribution.sh sign externals

      - name: Archive macOS externals
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh archive externals "$RUNNER_TEMP/macos-externals.zip"

      - name: Upload externals
        uses: actions/upload-artifact@v7
        with:
          name: bbb.dmx-macos
          path: ${{ runner.temp }}/macos-externals.zip

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBBB_DMX_BUILD_EXTERNALS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload externals
        uses: actions/upload-artifact@v7
        with:
          name: bbb.dmx-windows
          path: externals/

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install validation tools
        run: npm ci

      - name: Validate package JSON files against schemas
        run: scripts/validate-json-schemas.sh

      - name: Validate Max reference XML files
        run: scripts/validate-maxref-xml.sh

  package:
    permissions:
      contents: write
    needs: [build-macos, build-windows, validate-json]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download macOS externals
        uses: actions/download-artifact@v8
        with:
          name: bbb.dmx-macos
          path: ${{ runner.temp }}/macos-artifact

      - name: Restore signed macOS externals
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh extract "$RUNNER_TEMP/macos-artifact/macos-externals.zip" "dist/${{ github.event.repository.name }}"


      - name: Download Windows externals
        uses: actions/download-artifact@v8
        with:
          name: bbb.dmx-windows
          path: dist/bbb.dmx/externals/

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bbb.dmx
          cp package-info.json dist/bbb.dmx/
          cp README.md dist/bbb.dmx/ 2>/dev/null || true
          cp LICENSE dist/bbb.dmx/ 2>/dev/null || true
          mkdir -p dist/bbb.dmx/docs
          cp -r libs/bbb-dmx/docs/. dist/bbb.dmx/docs/ 2>/dev/null || true
          cp -r docs/. dist/bbb.dmx/docs/ 2>/dev/null || true
          cp -r help dist/bbb.dmx/
          cp -r fixtures dist/bbb.dmx/
          cp -r maps dist/bbb.dmx/
          cp -r patches dist/bbb.dmx/
          cp -r curves dist/bbb.dmx/ 2>/dev/null || true
          cp -r masks dist/bbb.dmx/ 2>/dev/null || true
          cp -r palettes dist/bbb.dmx/ 2>/dev/null || true
          cp -r scenes dist/bbb.dmx/ 2>/dev/null || true
          cp -r asserts dist/bbb.dmx/ 2>/dev/null || true
          cp -r libs/bbb-dmx/schemas dist/bbb.dmx/ 2>/dev/null || true

      - name: Create macOS-preserving archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent bbb.dmx bbb.dmx.zip

      - name: Notarize and verify public archive
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: .github/scripts/macos-direct-distribution.sh notarize-and-verify "dist/${{ github.event.repository.name }}.zip" "${{ github.event.repository.name }}"

      - name: Generate archive checksum
        shell: bash
        run: .github/scripts/macos-direct-distribution.sh checksum "dist/${{ github.event.repository.name }}.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: bbb.dmx-latest
          path: |
            dist/${{ github.event.repository.name }}.zip
            dist/${{ github.event.repository.name }}.zip.sha256

      - name: Upload to versioned release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ github.event.repository.name }}.zip
            dist/${{ github.event.repository.name }}.zip.sha256

      - name: Update latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > latest-release-notes.md <<EOF
          Latest main build for bbb.dmx.

          Commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This is a moving release generated from main. Use versioned v* releases for pinned/stable installs.
          EOF

          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/bbb.dmx.zip#bbb.dmx.zip dist/bbb.dmx.zip.sha256 --clobber
            gh release edit latest --title "bbb.dmx latest" --notes-file latest-release-notes.md --target "$GITHUB_SHA" --latest
          else
            gh release create latest dist/bbb.dmx.zip#bbb.dmx.zip dist/bbb.dmx.zip.sha256 \
              --title "bbb.dmx latest" \
              --notes-file latest-release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
