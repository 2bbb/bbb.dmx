name: Build & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DBBB_DMX_BUILD_EXTERNALS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify universal binaries
        run: |
          while IFS= read -r binary; do
            lipo -info "$binary"
            lipo "$binary" -verify_arch x86_64 arm64
          done < <(find externals -path '*/Contents/MacOS/*' -type f | sort)

      - name: Check macOS signing secrets
        id: macos_signing
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD DEVELOPER_ID_APPLICATION; do
            if [ -z "${!name:-}" ]; then
              echo "::notice::$name is not set; macOS externals will be uploaded unsigned"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.macos_signing.outputs.available == 'true'
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$CERTIFICATE_P12" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign Max externals
        if: steps.macos_signing.outputs.available == 'true'
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          BUNDLE_ID_PREFIX: jp.2bit
        run: |
          set -euo pipefail
          sanitize_identifier_component() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9.-]+/-/g; s/^-+//; s/-+$//'
          }
          while IFS= read -r -d '' mxo; do
            name="$(basename "$mxo" .mxo)"
            component="$(sanitize_identifier_component "$name")"
            identifier="${BUNDLE_ID_PREFIX}.${component}"
            codesign --force --deep --options runtime --timestamp \
              --identifier "$identifier" \
              --sign "$DEVELOPER_ID_APPLICATION" \
              "$mxo"
            codesign --verify --deep --strict --verbose=2 "$mxo"
          done < <(find externals -name "*.mxo" -type d -print0 | sort -z)

      - name: Upload externals
        uses: actions/upload-artifact@v7
        with:
          name: bbb.dmx-macos
          path: externals/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBBB_DMX_BUILD_EXTERNALS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload externals
        uses: actions/upload-artifact@v7
        with:
          name: bbb.dmx-windows
          path: externals/

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate package JSON files against schemas
        run: scripts/validate-json-schemas.sh

  package:
    permissions:
      contents: write
    needs: [build-macos, build-windows, validate-json]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download macOS externals
        uses: actions/download-artifact@v8
        with:
          name: bbb.dmx-macos
          path: dist/bbb.dmx/externals/

      - name: Download Windows externals
        uses: actions/download-artifact@v8
        with:
          name: bbb.dmx-windows
          path: dist/bbb.dmx/externals/

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bbb.dmx
          cp package-info.json dist/bbb.dmx/
          cp README.md dist/bbb.dmx/ 2>/dev/null || true
          cp LICENSE dist/bbb.dmx/ 2>/dev/null || true
          mkdir -p dist/bbb.dmx/docs
          cp -r libs/bbb-dmx/docs/. dist/bbb.dmx/docs/ 2>/dev/null || true
          cp -r docs/. dist/bbb.dmx/docs/ 2>/dev/null || true
          cp -r help dist/bbb.dmx/
          cp -r fixtures dist/bbb.dmx/
          cp -r maps dist/bbb.dmx/
          cp -r patches dist/bbb.dmx/
          cp -r curves dist/bbb.dmx/ 2>/dev/null || true
          cp -r masks dist/bbb.dmx/ 2>/dev/null || true
          cp -r palettes dist/bbb.dmx/ 2>/dev/null || true
          cp -r scenes dist/bbb.dmx/ 2>/dev/null || true
          cp -r asserts dist/bbb.dmx/ 2>/dev/null || true
          cp -r libs/bbb-dmx/schemas dist/bbb.dmx/ 2>/dev/null || true
          find dist/bbb.dmx/externals -path '*/Contents/MacOS/*' -type f -exec chmod 755 {} +

      - name: Create macOS-preserving archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent bbb.dmx bbb.dmx.zip

      - name: Check notarization secrets
        id: notarization
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::notice::$name is not set; package will be uploaded without notarization"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notarize archive
        if: steps.notarization.outputs.available == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "dist/bbb.dmx.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: bbb.dmx-latest
          path: dist/bbb.dmx.zip

      - name: Upload to versioned release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/bbb.dmx.zip

      - name: Update latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > latest-release-notes.md <<EOF
          Latest main build for bbb.dmx.

          Commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This is a moving release generated from main. Use versioned v* releases for pinned/stable installs.
          EOF

          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/bbb.dmx.zip#bbb.dmx.zip --clobber
            gh release edit latest --title "bbb.dmx latest" --notes-file latest-release-notes.md --target "$GITHUB_SHA" --latest
          else
            gh release create latest dist/bbb.dmx.zip#bbb.dmx.zip \
              --title "bbb.dmx latest" \
              --notes-file latest-release-notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
